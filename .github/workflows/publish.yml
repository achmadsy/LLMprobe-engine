name: publish-sidecar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_key: amd64_digest
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_key: arm64_digest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Collect digest
        run: |
          echo "{\"${{ matrix.digest_key }}\":\"${{ steps.build.outputs.digest }}\"}" > digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.digest_key }}
          path: digest.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Read digests
        id: digests
        run: |
          AMD64=$(jq -r '.amd64_digest' digests/digest-amd64_digest.json)
          ARM64=$(jq -r '.arm64_digest' digests/digest-arm64_digest.json)
          echo "amd64=$AMD64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Merge manifests and push tags
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ghcr.io/${{ github.repository }}@sha256:${{ steps.digests.outputs.amd64 }} \
            ghcr.io/${{ github.repository }}@sha256:${{ steps.digests.outputs.arm64 }}
